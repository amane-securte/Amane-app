name: amane_app
description: "Application AMANE Sécurité privée – أمان للأمن الخصوصي"
publish_to: 'none'
version: 1.0.23+50

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  geolocator: any
  url_launcher: any
  shared_preferences: any
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  pdf: any
  printing: any
  flutter_map: any
  latlong2: any
  firebase_messaging: any
  audioplayers: any
  image_picker: any
  excel: any
  share_plus: any

dev_dependencies:
  flutter_lints: any
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/siren.wav
    - assets/chime.wav
    - assets/logo_full.png
    - assets/logo_full_t.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon.png
    background_color: "#f7f2e7"
    theme_color: "#0f2a40"
