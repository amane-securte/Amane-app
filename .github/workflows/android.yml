name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        env:
          AMANE_KEY_PASSWORD: ${{ secrets.AMANE_KEY_PASSWORD }}
        run: |
          flutter --version
          flutter create --platforms=android --org mr.amane --project-name amane_app .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK and Play Store bundle
        env:
          AMANE_KEY_PASSWORD: ${{ secrets.AMANE_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Amane.apk
          cp build/app/outputs/bundle/release/app-release.aab Amane-PlayStore.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Amane-telephone.apk
          ls -la *.apk *.aab
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build Amane-telephone.apk Amane.apk Amane-PlayStore.aab \
            --prerelease \
            --title "Amane – نسخة تجريبية / version de test" \
            --notes "Build ${{ github.run_number }} – ${GITHUB_SHA::7}"
