name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        env:
          AMANE_KEY_PASSWORD: ${{ secrets.AMANE_KEY_PASSWORD }}
        run: |
          flutter --version
          flutter create --platforms=android --org mr.amane --project-name amane_app .
          rm -f test/widget_test.dart
          python3 tool/patch_android.py

      - name: Install packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK and Play Store bundle
        env:
          AMANE_KEY_PASSWORD: ${{ secrets.AMANE_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Publish test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Amane.apk
          cp build/app/outputs/bundle/release/app-release.aab Amane-PlayStore.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Amane-telephone.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Amane-32bit.apk
          ls -la *.apk *.aab
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build Amane-32bit.apk Amane-telephone.apk Amane.apk Amane-PlayStore.aab \
            --prerelease \
            --title "Amane – نسخة تجريبية / version de test" \
            --notes "Build ${{ github.run_number }} – ${GITHUB_SHA::7}"

      - name: Keep APKs for the website
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            Amane.apk
            Amane-telephone.apk
            Amane-32bit.apk
          retention-days: 3

  # Version web (iPhone, ordinateur) : https://amane-securite.web.app
  web:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        run: |
          flutter create --platforms=android,web --org mr.amane --project-name amane_app .
          rm -f test/widget_test.dart
          flutter pub get
          dart run flutter_launcher_icons
          python3 tool/patch_web.py

      - name: Build web
        run: flutter build web --release --no-tree-shake-icons

      # Page de téléchargement + APK + politique de confidentialité sur le
      # site AMANE (fonctionne même si le dépôt GitHub devient privé).
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: build/web/download

      - name: Download page and privacy policy
        run: |
          cp docs/download/index.html build/web/download/index.html
          mkdir -p build/web/privacy
          cp docs/index.html build/web/privacy/index.html
          ls -la build/web/download

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13 deploy --only hosting --project amane-securite --non-interactive
